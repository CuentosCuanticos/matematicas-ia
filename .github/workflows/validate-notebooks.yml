name: Validate and normalize notebooks

on:
  push:
    branches: [main]
    paths:
      - '**/*.ipynb'
      - 'tools/normalize_notebooks.py'
      - '.github/workflows/validate-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook validator
        run: python -m pip install --disable-pip-version-check 'nbformat>=5.10,<6'

      - name: Repair and validate every notebook
        run: python tools/normalize_notebooks.py --write --strict

      - name: Commit normalized notebooks when needed
        run: |
          if git diff --quiet -- '*.ipynb'; then
            echo 'All notebooks already valid.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.ipynb'
          git commit -m 'Normalize notebooks for Jupyter and Colab'
          git push
